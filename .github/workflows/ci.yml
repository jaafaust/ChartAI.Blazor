name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ChartAI.Blazor.slnx

      - name: Build
        run: dotnet build ChartAI.Blazor.slnx -c Release --no-restore

      - name: Pack (validation only)
        run: dotnet pack ChartAI.Blazor/ChartAI.Blazor.csproj -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg
