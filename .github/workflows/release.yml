name: Release

# Push a tag like v1.2.3 to publish ChartAI.Blazor 1.2.3 to nuget.org
# and create a GitHub release with the package attached.
#
# The tag must point at a commit on master (where CI ran). A version nuget.org
# already has fails the run instead of being skipped, and the GitHub release is
# created only after nuget.org accepted the push, so the package attached to it
# is always the one nuget.org serves.
#
# Authenticates to nuget.org with Trusted Publishing (OIDC), so no API key is
# stored anywhere. The nuget.org account "jaafaust" must have a trusted
# publishing policy for repository jaafaust/ChartAI.Blazor, workflow file
# release.yml, no environment, package pattern ChartAI.Blazor.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Require the tagged commit to be on master
        run: |
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on master; release from a commit that CI has built on master."
            exit 1
          fi

      # Same Bun version as ci.yml: the committed bundle must match a fresh build.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Build chart engine (engine/src -> wwwroot/chartai.js)
        working-directory: ChartAI.Blazor/engine
        run: bun run build.ts

      - name: Verify the committed engine bundle is current
        run: git diff --exit-code --stat -- ChartAI.Blazor/wwwroot/chartai.js

      - name: Restore
        run: dotnet restore ChartAI.Blazor.slnx

      - name: Build
        run: >
          dotnet build ChartAI.Blazor.slnx -c Release --no-restore
          -p:Version=${{ steps.version.outputs.version }}
          -p:ContinuousIntegrationBuild=true

      - name: Pack
        run: >
          dotnet pack ChartAI.Blazor/ChartAI.Blazor.csproj -c Release --no-build -o artifacts
          -p:Version=${{ steps.version.outputs.version }}
          -p:ContinuousIntegrationBuild=true

      - name: Log in to nuget.org (Trusted Publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: jaafaust

      # No --skip-duplicate: a version nuget.org already has fails here (409 Conflict), so a
      # re-pushed tag cannot attach a freshly built package that differs from the published one.
      - name: Push to nuget.org
        id: push
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json

      - name: GitHub release
        if: steps.push.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          generate_release_notes: true
